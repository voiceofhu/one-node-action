name: Release Node
run-name: Release Node · ${{ inputs.version_tag }}

on:
  workflow_dispatch:
    inputs:
      node_ref:
        description: one-node-node branch, tag, or commit
        required: false
        default: main
      version_tag:
        description: Release version, for example v0.1.0
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-node-${{ inputs.version_tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NODE_REPOSITORY: voiceofhu/one-node-node
  NODE_IMAGE_NAME: voiceofhu/one-node-node
  RELEASE_REPOSITORY: voiceofhu/one-node-action

jobs:
  resolve:
    name: Resolve source
    runs-on: ubuntu-latest
    outputs:
      node_sha: ${{ steps.source.outputs.node_sha }}
      version: ${{ steps.source.outputs.version }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      image_ref: ${{ steps.source.outputs.image_ref }}
      image_revision_tag: ${{ steps.source.outputs.image_revision_tag }}
      image_build_tag: ${{ steps.source.outputs.image_build_tag }}
      should_build_image: ${{ steps.image.outputs.should_build }}
      gh_username: ${{ steps.github-identity.outputs.login }}

    steps:
      - name: Checkout public Action
        uses: actions/checkout@v4
        with:
          path: one-node-action
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Validate public entrypoints
        working-directory: one-node-action
        run: make check

      - name: Resolve immutable Node source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NODE_REF_INPUT: ${{ inputs.node_ref }}
          VERSION_TAG_INPUT: ${{ inputs.version_tag }}
          IMAGE_NAME: ${{ env.NODE_IMAGE_NAME }}
        run: |
          set -Eeuo pipefail

          version=${VERSION_TAG_INPUT#node-v}
          version=${version#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "version_tag must be a semantic version such as v0.1.0" >&2
            exit 1
          }

          node_ref=${NODE_REF_INPUT:-main}
          encoded_ref=$(jq -rn --arg value "$node_ref" '$value | @uri')
          node_sha=$(
            gh api "repos/$NODE_REPOSITORY/commits/$encoded_ref" --jq .sha
          )
          [[ "$node_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "GitHub returned an invalid Node commit" >&2
            exit 1
          }

          source_version=$(
            gh api "repos/$NODE_REPOSITORY/contents/VERSION?ref=$node_sha" \
              --jq .content |
              base64 --decode |
              tr -d '\r\n'
          )
          test "$source_version" = "$version" || {
            echo "Requested Node version $version does not match VERSION $source_version." >&2
            exit 1
          }

          image_name=$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          [[ "$image_name" =~ ^[a-z0-9][a-z0-9._/-]*$ ]] || {
            echo "Invalid GHCR image name: $image_name" >&2
            exit 1
          }

          echo "node_sha=$node_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=node-v$version" >> "$GITHUB_OUTPUT"
          echo "image_ref=$REGISTRY/$image_name" >> "$GITHUB_OUTPUT"
          echo "image_revision_tag=sha-$node_sha" >> "$GITHUB_OUTPUT"
          echo "image_build_tag=build-$node_sha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Resolve GitHub token identity
        id: github-identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: echo "login=$(gh api user --jq .login)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.github-identity.outputs.login }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Decide whether to build image
        id: image
        shell: bash
        env:
          IMAGE_REF: ${{ steps.source.outputs.image_ref }}
          IMAGE_REVISION_TAG: ${{ steps.source.outputs.image_revision_tag }}
        run: |
          set -Eeuo pipefail
          if bash one-node-action/.github/scripts/inspect-node-image.sh \
            "$IMAGE_REF:$IMAGE_REVISION_TAG"; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Using existing image $IMAGE_REF:$IMAGE_REVISION_TAG"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build_native:
    name: Build Node for linux/amd64
    needs: resolve
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Node
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NODE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.node_sha }}
          path: one-node-node
          token: ${{ secrets.GH_TOKEN }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout public Action
        uses: actions/checkout@v4
        with:
          path: one-node-action
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: one-node-node/go.mod
          cache-dependency-path: one-node-node/go.sum

      - name: Build release binary
        working-directory: one-node-node
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          NODE_SHA: ${{ needs.resolve.outputs.node_sha }}
        run: |
          make build-linux-amd64 \
            VERSION="$VERSION" \
            COMMIT="$NODE_SHA"
          file dist/one-node-node-linux-amd64 | grep -q 'statically linked'

      - name: Assemble release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d release-assets
          install -m 0755 \
            one-node-node/dist/one-node-node-linux-amd64 \
            release-assets/one-node-node-linux-amd64
          (
            cd release-assets
            sha256sum one-node-node-linux-amd64 >SHA256SUMS
          )

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-node-${{ needs.resolve.outputs.version }}
          path: release-assets
          if-no-files-found: error
          retention-days: 30

  build_image:
    name: Build Node image for linux/amd64
    needs:
      - resolve
      - build_native
    if: needs.resolve.outputs.should_build_image == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Node
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NODE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.node_sha }}
          path: one-node-node
          token: ${{ secrets.GH_TOKEN }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download tested Node binary
        uses: actions/download-artifact@v4
        with:
          name: release-node-${{ needs.resolve.outputs.version }}
          path: one-node-node/dist

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ needs.resolve.outputs.gh_username }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: one-node-node
          file: one-node-node/deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ needs.resolve.outputs.image_ref }}:${{ needs.resolve.outputs.image_build_tag }}
          labels: |
            org.opencontainers.image.title=One Node
            org.opencontainers.image.description=One Node runtime agent
            org.opencontainers.image.source=https://github.com/voiceofhu/one-node-node
            org.opencontainers.image.documentation=https://github.com/voiceofhu/one-node-action
            org.opencontainers.image.revision=${{ needs.resolve.outputs.node_sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
          cache-from: type=gha,scope=one-node-node-amd64
          cache-to: type=gha,scope=one-node-node-amd64,mode=max

  publish_release:
    name: Publish Node release
    needs:
      - resolve
      - build_native
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-node-${{ needs.resolve.outputs.version }}
          path: dist

      - name: Publish immutable Action release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          NODE_SHA: ${{ needs.resolve.outputs.node_sha }}
          IMAGE_REF: ${{ needs.resolve.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "$RELEASE_REPOSITORY" || {
            echo "Node releases may only be published by $RELEASE_REPOSITORY." >&2
            exit 1
          }

          release_body="$(
            printf 'Node source: %s@%s\nDocker image: %s:%s\nImmutable image: %s:sha-%s' \
              "$NODE_REPOSITORY" "$NODE_SHA" \
              "$IMAGE_REF" "$VERSION" \
              "$IMAGE_REF" "$NODE_SHA"
          )"
          if existing_release=$(
            gh release view "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --json body,assets 2>/dev/null
          ); then
            existing_source=$(jq -r '.body // "" | split("\n")[0]' <<<"$existing_release")
            expected_source="Node source: $NODE_REPOSITORY@$NODE_SHA"
            test "$existing_source" = "$expected_source" || {
              echo "Release $RELEASE_TAG belongs to a different Node source." >&2
              exit 1
            }
            for asset in \
              one-node-node-linux-amd64 \
              SHA256SUMS; do
              jq -e --arg asset "$asset" \
                '.assets | any(.[]; .name == $asset)' \
                <<<"$existing_release" >/dev/null || {
                  echo "Release $RELEASE_TAG is incomplete; refusing to mutate it." >&2
                  exit 1
                }
            done
            echo "Immutable Node release $RELEASE_TAG already exists."
            exit 0
          fi

          gh release create "$RELEASE_TAG" dist/* \
            --repo "$RELEASE_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "One Node v$VERSION" \
            --notes "$release_body"

  publish_image:
    name: Publish Node image
    needs:
      - resolve
      - build_image
    if: >-
      always() &&
      !cancelled() &&
      needs.resolve.result == 'success' &&
      (needs.resolve.outputs.should_build_image == 'false' || needs.build_image.result == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: one-node-node-image
      cancel-in-progress: false

    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          path: one-node-action
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ needs.resolve.outputs.gh_username }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Publish versioned image
        shell: bash
        env:
          IMAGE: ${{ needs.resolve.outputs.image_ref }}
          IMAGE_REVISION_TAG: ${{ needs.resolve.outputs.image_revision_tag }}
          IMAGE_VERSION: ${{ needs.resolve.outputs.version }}
          IMAGE_BUILD_TAG: ${{ needs.resolve.outputs.image_build_tag }}
          SHOULD_BUILD: ${{ needs.resolve.outputs.should_build_image }}
          IMAGE_SOURCE: https://github.com/voiceofhu/one-node-node
          IMAGE_DESCRIPTION: One Node runtime agent
          IMAGE_REVISION: ${{ needs.resolve.outputs.node_sha }}
        run: bash one-node-action/.github/scripts/publish-node-image.sh
